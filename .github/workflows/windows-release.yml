name: Windows standalone release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for the build
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight runtime and packager
        run: python -m pip install "pyinstaller==6.22.3" "PyQt6>=6.6" "Pillow>=10.0" "psutil>=5.9" "PyGetWindow>=0.0.9" "winsdk==1.0.0b10"

      - name: Build Windows app bundle
        run: pyinstaller --clean --noconfirm RetroDeskPet.spec

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          $archive = "dist/RetroDeskPet-windows-x64.zip"
          Compress-Archive -Path "dist/RetroDeskPet/*" -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RetroDeskPet-windows-x64.zip" | Set-Content -Path "dist/RetroDeskPet-windows-x64.zip.sha256" -Encoding ascii

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RetroDeskPet-windows-x64
          path: |
            dist/RetroDeskPet-windows-x64.zip
            dist/RetroDeskPet-windows-x64.zip.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist/RetroDeskPet-windows-x64.zip" "dist/RetroDeskPet-windows-x64.zip.sha256" --clobber
          } else {
            gh release create $tag "dist/RetroDeskPet-windows-x64.zip" "dist/RetroDeskPet-windows-x64.zip.sha256" --title "Retro Desk Pet $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

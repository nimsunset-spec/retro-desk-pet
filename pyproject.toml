[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-desk-pet"
version = "0.1.3"
description = "An offline retro desktop pet and Tamagotchi-style companion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "Pillow>=10.0",
    "psutil>=5.9",
    "PyGetWindow>=0.0.9",
    "winsdk==1.0.0b10; platform_system == 'Windows'",
]

[project.scripts]
retro-pet = "main:main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["assets", "brain", "core", "ui"]
namespaces = false

[tool.setuptools.package-data]
assets = ["sprites/*.png"]
brain = ["dataset.json", "ngram_model.json"]
